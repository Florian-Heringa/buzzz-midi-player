appId: com.buzzz.midi-player
productName: Buzzz Midi Player
copyright: Copyright © 2026 Florian Heringa
# No auto-update: releases are published by the GitHub workflow, not by electron-builder.
publish: null
directories:
  output: dist
files:
  - out/**
  - package.json
# The renderer is bundled by Vite; only js-synthesizer is loaded at runtime (export worker).
extraResources:
  - from: resources/soundfonts
    to: soundfonts
    filter:
      - '*.sf2'
      - '*LICENSE*'
  # The window and About icon at runtime.
  - from: resources/icons/icon.png
    to: icons/icon.png
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# One square PNG (1024px, made by `npm run make-icon`) for every platform; electron-builder
# makes the .ico and .icns.
icon: resources/icons/icon.png
# No spaces: release downloads keep their names.
artifactName: buzzz-midi-player-${version}-${os}-${arch}.${ext}
fileAssociations:
  - ext: [mid, midi]
    # The file type's ID on Windows (unique, so other MIDI apps don't share it) and its Kind
    # in the macOS Finder.
    name: Buzzz Midi Player MIDI file
    description: MIDI file
    role: Viewer
    mimeType: audio/midi

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: buzzz-midi-player-${version}-setup.${ext}

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  # Unsigned for now: ad-hoc signing only (Apple Silicon refuses to run unsigned code at all).
  identity: '-'
  notarize: false
dmg:
  artifactName: buzzz-midi-player-${version}-mac-${arch}.${ext}

linux:
  category: Audio
  # Debian packages need a maintainer with an email address.
  maintainer: Florian Heringa <19365751+Florian-Heringa@users.noreply.github.com>
  synopsis: MIDI player for practicing vocal parts
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
