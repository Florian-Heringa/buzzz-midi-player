appId: com.buzzz.midi-player
productName: Buzzz Midi Player
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The renderer is bundled by Vite; only js-synthesizer is loaded at runtime (export worker).
extraResources:
  - from: resources/soundfonts
    to: soundfonts
    filter:
      - '*.sf2'
      - '*LICENSE*'
# One square PNG (1024px) for every platform; electron-builder makes the .ico and .icns.
icon: _resources/MidiPlayerLogo.png
# No spaces: release downloads keep their names.
artifactName: buzzz-midi-player-${version}-${os}-${arch}.${ext}
fileAssociations:
  - ext: [mid, midi]
    name: MIDI file
    role: Viewer
    mimeType: audio/midi

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: buzzz-midi-player-${version}-setup.${ext}

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Unsigned for now: ad-hoc signing only (Apple Silicon refuses to run unsigned code at all).
  identity: '-'
  notarize: false
dmg:
  artifactName: buzzz-midi-player-${version}-mac-${arch}.${ext}

linux:
  category: Audio
  # Debian packages need a maintainer with an email address.
  maintainer: Florian Heringa <Florian-Heringa@users.noreply.github.com>
  synopsis: MIDI player for practicing vocal parts
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
