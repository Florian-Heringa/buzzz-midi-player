# Publishes the web version to GitHub Pages (https://florian-heringa.github.io/buzzz-midi-player/)
# on every push to main, so the site follows what is merged. Running it by hand (Actions > Pages >
# Run workflow) deploys again. Needs Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The web build never runs Electron, so skip downloading its binary (about 100 MB).
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run fetch-soundfont
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
