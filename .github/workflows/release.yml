# Builds the installers on Windows, macOS and Linux. Pushing a version tag (v0.2.0, matching
# "version" in package.json) also puts them in a draft GitHub release to review and publish.
# Running it by hand (Actions > Release > Run workflow) only builds them, as downloadable
# workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run fetch-soundfont
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Build installers
        run: npm run build:${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
